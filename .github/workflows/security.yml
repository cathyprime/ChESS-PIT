name: security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  audit-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install --require-hashes -r backend/requirements.lock
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.lock
      - run: PYTHONPATH=backend python -m unittest discover -s tests -v
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm audit --omit=dev
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: docker build --file Containerfile --target api -t chesspit-api:audit .
      - run: docker build --file Containerfile --target engine-runtime -t chesspit-engine-runtime:audit .
